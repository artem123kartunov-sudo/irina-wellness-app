
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Irina Wellness</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101b17;
      color: #f5f7f5;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    header {
      padding: 32px 20px;
      background: linear-gradient(135deg, #203e30, #101b17);
    }
    h1 { color: #b8d9c4; margin: 0 0 8px; }
    h2 { font-size: 20px; }
    p { color: #b9c8be; line-height: 1.5; }
    main { padding: 20px; }
    .card {
      background: #203329;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 14px;
      cursor: pointer;
    }
    .card:active { background: #30513d; }
    .card strong { font-size: 18px; }
    button {
      background: #56866b;
      color: white;
      border: 0;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      width: 100%;
      cursor: pointer;
    }
    .back { margin-bottom: 20px; }
    .hidden { display: none; }
    .notice {
      padding: 16px;
      background: #203329;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 Irina Wellness</h1>
    <p>Здоровье, забота и гармония</p>
  </header>

  <main>
    <section id="home">
      <h2>Главное меню</h2>

      <div class="card" onclick="openPage('shop')">
        <strong>🛍 Siberian Wellness</strong>
        <p>Каталог продукции</p>
      </div>

      <div class="card" onclick="openPage('programs')">
        <strong>🌿 Программы здоровья</strong>
        <p>Подбор программ поддержки здоровья</p>
      </div>

      <div class="card" onclick="openPage('tests')">
        <strong>🧪 Анализы Гемотест</strong>
        <p>Информация об анализах</p>
      </div>

      <div class="card" onclick="openPage('consultation')">
        <strong>📅 Консультация</strong>
        <p>Запись на консультацию</p>
      </div>

      <div class="card" onclick="openPage('about')">
        <strong>👩🏻‍⚕️ Об Ирине</strong>
        <p>Знакомство со специалистом</p>
      </div>
    </section>

    <section id="details" class="hidden">
      <button class="back" onclick="goHome()">← Главное меню</button>
      <h2 id="pageTitle"></h2>
      <div class="notice" id="pageContent"></div>
    </section>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const pages = {
      shop: {
        title: "🛍 Siberian Wellness",
        text: "Здесь появятся товары, цены и корзина."
      },
      programs: {
        title: "🌿 Программы здоровья",
        text: "Здесь будут представлены программы поддержки здоровья."
      },
      tests: {
        title: "🧪 Анализы Гемотест",
        text: "Здесь появится информация об анализах."
      },
      consultation: {
        title: "📅 Консультация",
        text: "Здесь будет форма записи на консультацию."
      },
      about: {
        title: "👩🏻‍⚕️ Об Ирине",
        text: "Ирина Егорова — нутрициолог. Здесь будет информация о специалисте."
      }
    };

    function openPage(name) {
      const page = pages[name];
      if (!page) return;

      document.getElementById("pageTitle").textContent = page.title;
      document.getElementById("pageContent").textContent = page.text;
      document.getElementById("home").classList.add("hidden");
      document.getElementById("details").classList.remove("hidden");
    }

    function goHome() {
      document.getElementById("details").classList.add("hidden");
      document.getElementById("home").classList.remove("hidden");
    }
  </script>
</body>
</html>
